Status: Ready
Title: HepG2 Toxicity (MMV Data)
Description: Predicts cytotoxicity in HepG2 liver carcinoma cells, the standard 
  counter- screen for separating genuine antiparasitic activity from general 
  cell killing. Ersilia trained two LazyQSAR classifiers on 72-hour IC50 data 
  for 1,335 compounds from Medicines for Malaria Venture, calling toxicity below
  5 uM (104 toxic) or 10 uM (746 toxic), with AUROC 0.88 and 0.79 in five-fold 
  out-of-fold validation. Outputs are ranks against 50,000 drug-like molecules. 
  A single cell line does not anticipate organ-level or metabolism-dependent 
  toxicity.
